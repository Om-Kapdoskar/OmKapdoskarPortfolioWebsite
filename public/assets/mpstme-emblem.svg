<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="mpNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mpCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="mpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="mpShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Medallion Ring -->
  <circle cx="120" cy="120" r="112" fill="#0b0f19" stroke="url(#mpGold)" stroke-width="4" />
  <circle cx="120" cy="120" r="102" fill="url(#mpNavy)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#mpGold)" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8" />

  <!-- Heraldic Crest Shield -->
  <path d="M68 56 H172 V116 C172 154 146 180 120 193 C94 180 68 154 68 116 Z" fill="#0f172a" stroke="url(#mpGold)" stroke-width="3.2" filter="url(#mpShadow)" />
  
  <!-- Quadrant Split Inside Shield -->
  <path d="M71 59 H120 V116 H71 Z" fill="url(#mpCrimson)" opacity="0.92" />
  <path d="M120 59 H169 V116 H120 Z" fill="#1e3a8a" opacity="0.92" />
  <path d="M71 116 H169 C167 150 144 174 120 189 C96 174 73 150 71 116 Z" fill="#172554" />
  
  <!-- Shield Cross Divider -->
  <line x1="120" y1="58" x2="120" y2="190" stroke="url(#mpGold)" stroke-width="2.2" />
  <line x1="70" y1="116" x2="170" y2="116" stroke="url(#mpGold)" stroke-width="2.2" />

  <!-- Engineering Gear / Star in Top Left -->
  <circle cx="95" cy="87" r="14" fill="none" stroke="url(#mpGold)" stroke-width="3.5" stroke-dasharray="5 3" />
  <circle cx="95" cy="87" r="6" fill="url(#mpGold)" />

  <!-- Torch / Knowledge Sun in Top Right -->
  <circle cx="145" cy="87" r="12" fill="url(#mpGold)" />
  <circle cx="145" cy="87" r="7" fill="#1e3a8a" />
  <circle cx="145" cy="87" r="3.5" fill="#fef08a" />

  <!-- Monogram Banner Across Shield Center -->
  <rect x="74" y="103" width="92" height="24" rx="5" fill="#090d16" stroke="url(#mpGold)" stroke-width="2" filter="url(#mpShadow)" />
  <text x="120" y="119" text-anchor="middle" fill="#fef08a" font-family="Montserrat, Arial, sans-serif" font-size="13.5" font-weight="900" letter-spacing="2">MPSTME</text>

  <!-- Open Book / Data Nodes in Lower Shield -->
  <path d="M98 148 Q109 142 120 148 Q131 142 142 148 V164 Q131 158 120 164 Q109 158 98 164 Z" fill="url(#mpGold)" opacity="0.95" />
  <line x1="120" y1="148" x2="120" y2="164" stroke="#0f172a" stroke-width="2" />

  <!-- Top & Bottom University Inscriptions -->
  <text x="120" y="42" text-anchor="middle" fill="#fef08a" font-family="Montserrat, Arial, sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.2">MUKESH PATEL</text>
  <text x="120" y="213" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2">SVKM&apos;S NMIMS</text>
</svg>